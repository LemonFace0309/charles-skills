  <script>
    const T = { sel: 0.55, swap: 2.15 };
    const tl = gsap.timeline({ paused: true });
    AR.names(); // fills [data-name] text, icons, image placeholders and the tiles' select overlays
    const grid = document.querySelector("#SCENE-grid"), rowH = grid.querySelector(".wb-ig-tile").offsetHeight + 4;
    const rows = Math.ceil(grid.children.length / 3), sel = 1.35, per = sel / rows;
    // the page scrolls to the grid, then keeps scrolling a row at a time while the selection runs
    AR.pageTo(tl, "#SCENE-a", T.sel - 0.3, { to: grid, pad: 4, dur: 0.3 });
    for (let k = 1; k < rows - 1; k++) AR.pageTo(tl, "#SCENE-a", T.sel + k * per - 0.06, { y: grid.offsetTop + k * rowH - 90, dur: Math.min(0.2, per * 0.8) });
    AR.selectGrid(tl, "#SCENE-grid .wb-ig-tile", T.sel, { dur: sel, counter: "#SCENE-count", to: 738 });
    AR.navigate(tl, "#SCENE-a", "#SCENE-b", T.swap, { load: 0 }); // the hard cut to the clone's profile
    window.__timelines["SCENE"] = tl;
