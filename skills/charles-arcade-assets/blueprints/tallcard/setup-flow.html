    const T = { code: 0.45, copy: 0.95, claude: 1.35, install: 2.15, send: 2.75, done: 3.2, end: 3.9 };

    const REPO = { owner: "@owner", name: "@repo", about: "A Claude skill that reads any creator's top posts and writes you the playbook behind them.",
      stars: "19.4k", forks: "2.2k" };
    const PROMPT = " install skill";                    // typed after the pasted link (keep the leading space)
    const RESULT = { title: "Skill installed", sub: "{name} · ready to use", reading: "Reading {owner}/{name}", installing: "Installing the skill" };

    const tl = gsap.timeline({ paused: true });
    AR.names();
    AR.clIcons();
    const $ = (id) => document.getElementById("SCENE-" + id);
    const word = (v) => (typeof v === "string" && v[0] === "@" ? String((window.NAMES || {})[v.slice(1)] ?? v.slice(1)) : v);
    const owner = word(REPO.owner), name = word(REPO.name), fill = (s) => s.replace("{owner}", owner).replace("{name}", name);
    $("owner").textContent = owner; $("repo").textContent = name; $("about").textContent = REPO.about;
    $("stars").textContent = REPO.stars; $("forks").textContent = REPO.forks;
    $("url").textContent = `https://github.com/${owner}/${name}.git`;
    document.querySelectorAll(".SCENE-link").forEach((e) => { e.textContent = `github.com/${owner}/${name}`; });
    $("sentp").textContent = PROMPT;
    $("s1").textContent = fill(RESULT.reading); $("s2").textContent = fill(RESULT.installing);
    $("rt").textContent = RESULT.title; $("rs").textContent = fill(RESULT.sub);
    // the clone menu hangs under the Code button, right edges aligned
    const code = $("code"), menu = $("menu");
    Object.assign(menu.style, { left: code.offsetLeft + code.offsetWidth - menu.offsetWidth + "px", top: code.offsetTop + code.offsetHeight + 8 + "px" });

    // the cursor clicks Code; the menu drops open; it clicks copy: "Copied!"
    const cur = "#SCENE-cur";
    AR.cursorTo(tl, cur, code, T.code - 0.36, 0.3, { ax: 0.42, ay: 0.55 });
    AR.cursorShape(tl, cur, "hand", T.code - 0.1);
    AR.click(tl, cur, T.code - 0.05);
    AR.wbMenu(tl, menu, T.code, { button: code, pressed: "#1a7f37" });
    AR.cursorTo(tl, cur, "#SCENE-copy", T.copy - 0.32, 0.26);
    AR.click(tl, cur, T.copy - 0.05);
    AR.wbCopied(tl, "#SCENE-copy", T.copy, { parent: "#SCENE-gh", hold: 0.9 });
    // the link arcs down into Claude's input and lands on "Claude"; the cursor follows it down
    AR.wbChip(tl, "#SCENE-chip", "#SCENE-url", "#SCENE-inchip", T.claude + 0.02, DUR.fly, { lift: T.copy + 0.08, arc: 90 });
    tl.set("#SCENE-ph", { opacity: 0 }, T.claude + 0.02 + DUR.fly);
    AR.cursorShape(tl, cur, "arrow", T.claude);
    AR.cursorTo(tl, cur, "#SCENE-box", T.claude + 0.1, DUR.fly, { ax: 0.86, ay: 1.2 });
    // "install skill" types on its word; the cursor clicks send
    AR.composer(tl, "#SCENE-box", T.install, PROMPT, { cps: 26 });
    AR.cursorTo(tl, cur, "#SCENE-send", T.send - 0.3, 0.24);
    AR.cursorShape(tl, cur, "hand", T.send - 0.08);
    AR.click(tl, cur, T.send - 0.05);
    AR.press(tl, "#SCENE-send", T.send - 0.04);
    // the conversation: Claude reads the repo, installs it; the success card lands and the camera pushes in
    const tc = T.send + 0.12;
    tl.set("#SCENE-home", { opacity: 0 }, tc);
    tl.set(["#SCENE-convo", "#SCENE-ctitle"], { opacity: 1 }, tc);
    tl.set(cur, { opacity: 0 }, tc);
    tl.fromTo("#SCENE-sent", { y: 24 }, { y: 0, duration: 0.24, ease: "power3.out", immediateRender: false }, tc);
    AR.clSteps(tl, "#SCENE-steps", tc + 0.08, { times: [tc + 0.08, Math.max(tc + 0.3, T.done - 0.25)] });
    AR.clSpark(tl, "#SCENE-spark", tc + 0.08, T.end - tc - 0.08, { turns: 0.6 });
    tl.fromTo("#SCENE-done", { opacity: 0, scale: 0.86, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.26, ease: "back.out(2.4)" }, T.done);
    AR.frame(tl, "#SCENE-clcam", ["#SCENE-done", "#SCENE-s1", "#SCENE-s2"], T.done + 0.06, 0.32, { pad: [70, 70], max: 1.35 });   // the text, not the full-width rows
    window.__timelines["SCENE"] = tl;
