<!doctype html>
<!-- arcade root composition. Mount one scene per beat; keep the host id, its data-composition-id and the
     scene file's timeline key identical. Set data-duration on the root to the full length.
     Reel mode: keep the <audio> voice track. Clip mode (a part for charles-claude-editing): delete the <audio>. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/arcade.css" />
    <link rel="stylesheet" href="assets/critter.css" />
    <link rel="stylesheet" href="assets/cast.css" />
    <link rel="stylesheet" href="assets/ui-claude.css" />
    <link rel="stylesheet" href="assets/ui-web.css" />
    <link rel="stylesheet" href="assets/annotate.css" />
    <link rel="stylesheet" href="assets/dataviz.css" />
    <script src="assets/names.js"></script>
    <script src="assets/arcade.js"></script>
    <script src="assets/motion.js"></script>
    <script src="assets/critter.js"></script>
    <script src="assets/cast.js"></script>
    <script src="assets/ui-claude.js"></script>
    <script src="assets/ui-web.js"></script>
    <script src="assets/annotate.js"></script>
    <script src="assets/dataviz.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--stage); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="DURATION" data-width="1080" data-height="1920">
      <!-- one host per beat, e.g.
      <div id="b01" data-composition-id="b01" data-composition-src="compositions/b01.html"
           data-start="0" data-duration="1.7" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      -->
      <audio id="voice" src="assets/voice.m4a" data-start="0" data-duration="DURATION" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
