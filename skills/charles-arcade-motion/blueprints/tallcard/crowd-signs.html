<!-- BLUEPRINT crowd-signs, tall card (laid out at 1280x1550, the card that covers the face; fills it edge to edge):
     "everyone can tell", "nobody trusts it", "the judges agree". The NPC crowd (AR.crit.crowd) faces the camera, big,
     across the lower half; on the word each person raises a paddle, left to right; on the next word they all pump them
     and hop; the host sweats in front at the left. Optional: the paddles flip to a new verdict (SIGNS.back at T.turn:
     "X" to "10"), and a meter drains at the top (METER at T.drain: TRUST 100% -> 0%).
     Use for: a crowd's reaction, a verdict, a vote, "most people", "nobody", "everyone".
     Edit: SIGNS (text: "AI", "?", "X" (a red X), "10", or {img: "assets/logos/x.svg"}, or an array, one per person;
     back: the face T.turn flips to; color, backColor), N (people, 4-6; more get smaller), METER (label, from, to; null
     for none), HOST ("critter", "pal", or a cast.py character's folder in assets/cast: "charles"; a generated character
     is shocked on the raise, sad on the pump and cheers on the turn), LOOK (role, colour; h, wear for a generated
     character), and the T times: T.raise (the paddles go up, the word), T.pump (they pump: the second word), T.turn
     (the paddles flip, or null), T.drain (the meter drains, or null), T.end. The camera is locked. Anything added to
     #SCENE-cast after the crowd (an alert, a card) sits in front of it. Needs cast.js.
     mount.py copies it to compositions/<id>.html with SCENE replaced. -->
<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #SCENE-floor { position: absolute; left: 0; top: 1410px; width: 1280px; height: 140px; background: #e4ddd0; border-top: 6px solid #d3c9b8; }
    #SCENE-cast { position: absolute; left: 0; top: 0; width: 1280px; height: 1550px; }
    #SCENE-meter { position: absolute; left: 240px; top: 110px; width: 800px; height: 300px; background: #fff; border: 8px solid #171511; border-radius: 34px; box-shadow: 12px 14px 0 #171511; font-family: var(--sans); }
    #SCENE-meter h4 { position: absolute; left: 44px; top: 40px; margin: 0; font-size: 64px; font-weight: 700; letter-spacing: 0.08em; color: #171511; }
    #SCENE-pct { position: absolute; right: 44px; top: 26px; font-size: 100px; font-weight: 700; color: #171511; font-variant-numeric: tabular-nums; }
    #SCENE-bar { position: absolute; left: 44px; top: 170px; width: 696px; height: 80px; background: #eee7d8; border: 6px solid #171511; border-radius: 16px; overflow: hidden; }
    #SCENE-bar i { position: absolute; inset: 0; background: #2fa35b; transform-origin: 0 50%; }
  </style>
  <div id="root" data-composition-id="SCENE" data-width="1280" data-height="1550">
    <div class="stage" data-layout-ignore></div>
    <div id="SCENE-floor" data-layout-ignore></div>
    <div id="SCENE-cast"></div>
    <div id="SCENE-meter"><h4 id="SCENE-mlabel">TRUST</h4><div id="SCENE-pct"><span id="SCENE-mn">100</span>%</div><div id="SCENE-bar"><i id="SCENE-mfill"></i></div></div>
  </div>
  <script>
    const T = { raise: 0.25, pump: 0.9, turn: null, drain: null, end: 1.8 };
    const SIGNS = { text: "AI", back: null, color: "#D42C32", backColor: null };
    const N = 5, SEED = 11;
    const METER = null;                                  // e.g. { label: "TRUST", from: 100, to: 0 } with T.drain
    const HOST = "critter";                              // "critter", "pal", or a cast.py character ("charles")
    const LOOK = { role: null, color: null, h: 560, wear: null };   // h and wear: a generated character
    const tl = gsap.timeline({ paused: true });
    AR.names();
    const cast = document.getElementById("SCENE-cast");
    const meter = document.getElementById("SCENE-meter");
    if (!METER) meter.style.display = "none";
    else { document.getElementById("SCENE-mlabel").textContent = METER.label; document.getElementById("SCENE-mn").textContent = METER.from; }
    // the crowd faces the camera; the host stands at the left edge
    const x0 = 150, h = (METER ? 720 : 800) * Math.min(1, 5.5 / N);   // bigger without the meter; more people: smaller
    const npcs = AR.crit.crowd(cast, { id: "SCENE-npc", x: x0, y: 1500, w: 1250 - 2 * x0 + 120, h, n: N, seed: SEED });
    const signs = AR.crit.signs(npcs, { id: "SCENE-sign", text: SIGNS.text, back: SIGNS.back ?? undefined, color: SIGNS.color, backColor: SIGNS.backColor, seed: SEED });
    const host = AR.cast.host(cast, HOST, Object.assign({ id: "SCENE-host", u: 34, x: 240, y: 1520, eyes: "look-right" },
      LOOK.color ? { color: LOOK.color } : {}, LOOK.role ? { role: LOOK.role } : {},
      HOST === "critter" || HOST === "pal" ? {} : { h: LOOK.h, x: 210, wear: LOOK.wear }));
    // the crowd breathes until the paddles go up
    npcs.forEach((n, i) => AR.bob(tl, n, 0.04 + i * 0.05, Math.max(0.2, T.raise - 0.04 - i * 0.05), { amp: 8, fps: 3 }));
    // the word: paddles up, one by one; the host notices
    AR.crit.raise(tl, signs, T.raise, { gap: 0.05 });
    AR.crit.eyes(tl, host, T.raise, "wide");
    AR.cast.act(tl, host, T.raise, "shock");
    AR.crit.emote(tl, host, T.raise + 0.12, "sweat", { dur: 0.8 });
    // the next word: everyone pumps their paddle and hops
    const pumpEnd = T.turn ?? T.end;
    AR.crit.pump(tl, signs, T.pump, Math.max(0.3, Math.min(0.8, pumpEnd - T.pump - 0.05)), { npcs });
    AR.crit.eyes(tl, host, T.pump, "sad");
    AR.cast.act(tl, host, T.pump, "sad");
    if (T.turn != null && SIGNS.back != null) {
      AR.crit.turnSigns(tl, signs, T.turn, { gap: 0.03 });
      AR.crit.eyes(tl, host, T.turn + 0.1, "happy");
      AR.crit.victory(tl, host, T.turn + 0.15);
      AR.crit.pump(tl, signs, T.turn + 0.25, Math.max(0.3, T.end - T.turn - 0.35), { npcs });
    }
    if (METER && T.drain != null) {
      const fill = document.getElementById("SCENE-mfill"), k = (v) => Math.max(0.02, v / 100);
      gsap.set(fill, { scaleX: k(METER.from) });
      AR.bar(tl, fill, T.drain - 0.03, 0.36, { from: k(METER.from), to: k(METER.to), ease: "power2.out" });
      if (METER.to < METER.from) tl.to(fill, { backgroundColor: "#d42c32", duration: 0.2 }, T.drain + 0.05);
      AR.countTo(tl, "#SCENE-mn", T.drain - 0.03, 0.36, { from: METER.from, to: METER.to, format: "int", ease: "power2.out" });
      if (METER.to < METER.from) tl.to("#SCENE-pct", { color: "#d42c32", duration: 0.1 }, T.drain + 0.25);
      AR.shake(tl, meter, T.drain + 0.33, { amp: 10, dur: 0.2 });
    }
    AR.crit.alive(tl, host, 0, T.end, { bob: false });
    window.__timelines["SCENE"] = tl;
  </script>
</template>
