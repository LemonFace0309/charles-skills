     Use for: the last beat when the voiceover says "follow me and comment X".
     Edit: HANDLE, the avatar image, KEYWORD, the DM line, T.follow (the word "follow"), T.comment (the

  <script>
    const T = { follow: 0.45, comment: 1.3, end: 2.6 };

    AR.settle(tl, "#SCENE-card", 0, { dy: 18 });
